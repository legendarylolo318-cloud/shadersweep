[package]
name = "shadersweep-cli"
description = "shadersweep command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shadersweep"
path = "src/main.rs"

[dependencies]
shadersweep-core = { path = "../core" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
