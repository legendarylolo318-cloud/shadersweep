[package]
name = "shadersweep-gui"
description = "shadersweep graphical interface"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "shadersweep-gui"
path = "src/main.rs"

[dependencies]
shadersweep-core = { path = "../core" }
anyhow.workspace = true
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
notify = "8"

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"
